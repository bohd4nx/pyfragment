[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfragment"
version = "2026.5.0"
description = "Async Python client for Fragment.com: buy Telegram Stars and Premium, run giveaways, search usernames, numbers and gifts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "bohd4nx", email = "bohd4nx@gmail.com" }]
keywords = ["fragment", "telegram", "telegram-stars", "telegram-premium", "giveaway", "ton", "usdt", "usernames", "gifts", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["curl-cffi>=0.16.3", "ton-core>=0.7.1", "tonutils>=2.5.1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "mypy", "ruff"]

[project.urls]
Homepage = "https://github.com/bohd4nx/pyfragment"
Repository = "https://github.com/bohd4nx/pyfragment"
Documentation = "https://bohd4nx.gitbook.io/pyfragment/"
Issues = "https://github.com/bohd4nx/pyfragment/issues"
Changelog = "https://github.com/bohd4nx/pyfragment/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyfragment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^examples/", "^tests/", "^sandbox/"]

[[tool.mypy.overrides]]
module = "redis.*"  # only the shared_wallet example uses it
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyfragment.transport.api"
warn_unused_ignores = false
