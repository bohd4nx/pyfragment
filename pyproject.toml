[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfragment"
version = "2026.4.0"
description = "Async Python client for the Fragment.com marketplace API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "bohd4nx" }]
keywords = [
    "fragment",
    "telegram",
    "telegram-stars",
    "telegram-premium",
    "ton",
    "tonapi",
    "anonymous-numbers",
    "asyncio",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["curl-cffi>=0.16.3", "ton-core>=0.7.1", "tonutils>=2.5.1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "mypy", "ruff"]

[project.urls]
Repository = "https://github.com/bohd4nx/pyfragment"
Documentation = "https://bohd4nx.gitbook.io/pyfragment/"
Issues = "https://github.com/bohd4nx/pyfragment/issues"
Changelog = "https://github.com/bohd4nx/pyfragment/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyfragment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[0-9][0-9][0-9]_test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 128
target-version = "py311"
# Newer ruff releases format Python code fences inside Markdown by default; we don't want
# CHANGELOG.md/README.md code samples reformatted as a side effect of bumping the linter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^examples/", "^logs/", "^tests/", "^sandbox/", "^scripts/"]

[[tool.mypy.overrides]]
module = [
    "ton_core",
    "tonutils",
    "tonutils.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyfragment.transport.api"
warn_unused_ignores = false
